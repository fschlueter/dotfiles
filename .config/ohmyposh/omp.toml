  console_title_template = '{{ .Shell }} in {{ .Folder }}'
  version = 4
  final_space = true
  cursor_style = "blinking_block"

  [maps.host_name]
  # Mac = ""
  Mac = " "

  [palette]
    black = '#262B44'
    grey = '#8c8c8c'
    blue = '#4B95E9'
    green = '#59C9A5'
    orange = '#F07623'
    red = '#D81E5B'
    white = '#E0DEF4'
    yellow = '#F3AE35'

  [secondary_prompt]
    template = '<p:yellow,transparent></><,p:yellow> > </><p:yellow,transparent></> '
    foreground = 'p:black'
    background = 'transparent'

  [transient_prompt]
    template = '<p:grey,transparent></><,p:grey> {{ .Folder }} </><p:grey,transparent></> '
    foreground = 'p:black'
    background = 'transparent'

  [upgrade]
    source = 'cdn'
    interval = '168h'
    auto = false
    notice = false

  [[blocks]]
    type = 'prompt'
    alignment = 'left'
    newline = true

    [[blocks.segments]]
      leading_diamond = ''
      trailing_diamond = ''
      template = ' {{ if .SSHSession }} {{ end }}{{ .HostName }} '
      foreground = 'p:black'
      background = 'p:yellow'
      type = 'session'
      style = 'diamond'

  [[blocks]]
    type = 'prompt'
    alignment = 'left'

    [[blocks.segments]]
      type = "sysinfo"
      powerline_symbol = ""
      foreground = "#ffffff"
      background = "#8f43f3"
      template = "  {{ round .PhysicalPercentUsed .Precision }}% "
      style = "powerline"

      [blocks.segments.options]
        precision = 0

    [[blocks.segments]]
      type = "sysinfo"
      powerline_symbol = ''
      foreground = "#ffffff"
      background = "#8f43f3"
      template = "  {{ round .Load1 .Precision }}% "
      style = "powerline"

      [blocks.segments.options]
        precision = 1

  [[blocks]]
    type = 'prompt'
    alignment = 'left'

    [[blocks.segments]]
      template = '  {{ path .Path .Location }} '
      foreground = 'p:white'
      powerline_symbol = ''
      background = 'p:orange'
      type = 'path'
      style = 'powerline'

      [blocks.segments.options]
        style = 'folder'

    [[blocks.segments]]
      template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
      foreground = 'p:black'
      powerline_symbol = ''
      background = 'p:green'
      type = 'git'
      style = 'powerline'
      background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}', '{{ if gt .Ahead 0 }}#49416D{{ end }}', '{{ if gt .Behind 0 }}#7A306C{{ end }}']
      foreground_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:black{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:white{{ end }}', '{{ if gt .Ahead 0 }}p:white{{ end }}']

      [blocks.segments.options]
        branch_template = '{{ trunc 10 .Branch }}'

  [[blocks]]
    type = 'prompt'
    alignment = 'left'

    [[blocks.segments]]
      type = "python"
      style = "powerline"
      powerline_symbol = ""
      foreground = "#ffd43b"
      background = "#306998"
      template = "  {{ .Venv }} "

      [blocks.segments.options]
        home_enabled = true
        display_mode = "environment"

    [[blocks.segments]]
      template = '  '
      foreground = 'p:white'
      powerline_symbol = ''
      background = 'p:yellow'
      type = 'root'
      style = 'powerline'

    # Simple round end
    [[blocks.segments]]
      type = 'text'
      style = 'powerline'
      foreground = 'parentBackground'
      background = 'parentBackground'
      template = "<background,transparent></>"
      newline = true

  [[blocks]]
    type = 'prompt'
    alignment = 'left'
    newline = true

    [[blocks.segments]]
      type = 'text'
      style = 'plain'
      foreground = 'p:blue'
      foreground_templates = ['{{ if gt .Code 0 }}p:red{{ end }}']
      template = '❯'

  [[blocks]]
    type = 'rprompt'

    [[blocks.segments]]
      type = "executiontime"
      background = 'transparent'
      foreground = 'p:yellow'
      template = "{{ .FormattedMs }}<p:white> | </>"

    [[blocks.segments]]
      template = '<p:blue><b>{{ .CurrentDate | date "15:04:05" }}</b></>'
      foreground = 'p:white'
      background = 'transparent'
      type = 'time'
      style = 'plain'
