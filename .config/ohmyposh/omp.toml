console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 4
final_space = true
cursor_style = "blinking_underline"

[maps.host_name]
# Mac = ""
MacPal = " "
MacBook-Pro-8 = " "
NuRadioOpt-GPU = " NuRadio"
rno-g.uchicago.edu = "🇬🇱 "
# Theme switching: picks a palette based on $POSH_THEME (set via the
# `posh-theme` shell function), falls back to "default" if unset/unknown.
# Palettes live in themes/*.toml (one [palettes.list.<name>] each) and are
# appended to this file by .env/omp into a generated config at shell start.
# Each theme defines its raw hues (hue-*) and aliases them to purpose names
# (e.g. 'p:git-background'); segments only refer to the purpose names.
[palettes]
template = '{{ if .Env.POSH_THEME }}{{ .Env.POSH_THEME }}{{ else }}default{{ end }}'

[secondary_prompt]
template = '<p:secondary-prompt-background,transparent></><,p:secondary-prompt-background> > </><p:secondary-prompt-background,transparent></> '
foreground = 'p:secondary-prompt-foreground'
background = 'transparent'

[transient_prompt]
template = '<p:transient-prompt-background,transparent></><,p:transient-prompt-background> {{ .Folder }} </><p:transient-prompt-background,transparent></> '
foreground = 'p:transient-prompt-foreground'
background = 'transparent'

[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = false

[[blocks.segments]]
leading_diamond = ''
trailing_diamond = ''
template = ' {{ if .SSHSession }} {{ end }}{{ .HostName }} '
foreground = 'p:session-foreground'
background = 'p:session-background'
type = 'session'
style = 'diamond'

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
type = "sysinfo"
powerline_symbol = ''
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = " \uF0E4 {{ round .Load1 .Precision }}"
style = "powerline"

[blocks.segments.options]
precision = 1

[[blocks.segments]]
type = "text"
style = "powerline"
powerline_symbol = "\uE0B0"
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = "{{ if .Env.OMP_CPU }} \U000F061A {{ .Env.OMP_CPU }}%{{ end }}"

[[blocks.segments]]
type = "sysinfo"
powerline_symbol = ""
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = " \U000F035B {{ round .PhysicalPercentUsed .Precision }}%"
style = "powerline"

[blocks.segments.options]
precision = 0

[[blocks.segments]]
type = "text"
style = "powerline"
powerline_symbol = "\uE0B0"
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = "{{ if .Env.OMP_GPU }} \U000F0379 {{ .Env.OMP_GPU }}% {{ end }}"

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
template = '  {{ path .Path .Location }} '
foreground = 'p:path-foreground'
powerline_symbol = ''
background = 'p:path-background'
type = 'path'
style = 'powerline'

[blocks.segments.options]
style = 'letter'

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
foreground = 'p:git-foreground'
powerline_symbol = ''
background = 'p:git-background'
type = 'git'
style = 'powerline'
background_templates = [
  '{{ if or (.Working.Changed) (.Staging.Changed) }}p:git-background-dirty{{ end }}',
  '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git-background-diverged{{ end }}',
  '{{ if gt .Ahead 0 }}p:git-background-ahead{{ end }}',
  '{{ if gt .Behind 0 }}p:git-background-behind{{ end }}',
]
foreground_templates = [
  '{{ if or (.Working.Changed) (.Staging.Changed) }}p:git-foreground{{ end }}',
  '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git-foreground-diverged{{ end }}',
  '{{ if gt .Ahead 0 }}p:git-foreground-diverged{{ end }}',
]

[blocks.segments.options]
branch_template = '{{ trunc 10 .Branch }}'

[[blocks.segments]]
type = "python"
style = "powerline"
powerline_symbol = ""
foreground = "p:python-foreground"
background = "p:python-background"
template = "  {{ .Venv }} "

[blocks.segments.options]
home_enabled = true
display_mode = "environment"

[[blocks.segments]]
template = '  '
foreground = 'p:root-foreground'
powerline_symbol = ''
background = 'p:root-background'
type = 'root'
style = 'powerline'

# Simple round end: matches the background of the nearest enabled
# segment in this block (falls back to git when python/root are
# hidden); parentBackground only resolves within one block, so
# this must share a block with git rather than get its own.
[[blocks.segments]]
type = 'text'
style = 'powerline'
foreground = 'parentBackground'
background = 'parentBackground'
template = "<background,transparent></>"

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:prompt-foreground'
foreground_templates = ['{{ if gt .Code 0 }}p:prompt-foreground-error{{ end }}']
template = "\n❯"

[[blocks]]
type = 'rprompt'

[[blocks.segments]]
type = "executiontime"
background = 'transparent'
foreground = 'p:duration-foreground'
template = "{{ .FormattedMs }}<p:separator-foreground> | </>"

[[blocks.segments]]
template = '<p:time-foreground><b>{{ .CurrentDate | date "15:04:05" }}</b></>'
foreground = 'p:separator-foreground'
background = 'transparent'
type = 'time'
style = 'plain'
