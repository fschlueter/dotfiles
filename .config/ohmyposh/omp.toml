console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 4
final_space = true
#cursor_style = "blinking_underline"  -- set by ghostty

[maps.host_name]
# Mac = ""
MacPal = " "
MacBook-Pro-8 = " "
NuRadioOpt-GPU = " NuRadio"
"rno-g.uchicago.edu" = "\U000F019A rno-g"  # host names with a . need qotes

# Colors: ANSI names only, so the prompt follows the active Ghostty palette (`theme`, see AGENTS.md).
# Raw hues (hue-*) are the closest Matrix Contrast slots (comments: the original matrix hex), e.g. "red"
# holds yellow there; standard palettes then show dirty git red and errors gold. Segments only refer to
# the purpose-named aliases (e.g. 'p:git-background'). ANSI names cannot be shaded (darken/lighten, gradients).
[palette]
hue-black = 'black'       # #0F191C
hue-grey = 'darkGray'     # #7F9F76
hue-forest = 'blue'       # #23755A
hue-mint = 'lightGreen'   # #2FC079
hue-green = 'green'       # #82D967
hue-lime = 'white'        # #C1FF8A
hue-neon = 'green'        # #11FF25
hue-cyan = 'cyan'         # #4FE8C8
hue-yellow = 'red'        # #FAFF00
hue-red = 'lightYellow'   # #FF3860
hue-crimson = 'lightRed'  # #D8123F
hue-white = 'lightWhite'  # #D9FFD0

secondary-prompt-foreground = 'p:hue-black'
secondary-prompt-background = 'p:hue-lime'
transient-prompt-foreground = 'p:hue-black'
transient-prompt-background = 'p:hue-grey'

session-foreground = 'p:hue-black'
session-background = 'p:hue-lime'

sysinfo-foreground = 'p:hue-black'
sysinfo-background = 'p:hue-mint'

path-foreground = 'p:hue-black'    # dark text: 'blue' is brighter than forest
path-background = 'p:hue-forest'

git-foreground = 'p:hue-black'
git-background = 'p:hue-green'
git-foreground-diverged = 'p:hue-white'
git-background-dirty = 'p:hue-yellow'
git-background-diverged = 'p:hue-crimson'
git-background-ahead = 'blue'      # #1B5E3F
git-background-behind = 'darkGray' # #0B6B6B

root-foreground = 'p:hue-black'
root-background = 'p:hue-yellow'

python-foreground = 'p:hue-yellow'
python-background = 'black'        # #0B6B6B

prompt-foreground = 'p:hue-neon'
prompt-foreground-error = 'p:hue-red'

duration-foreground = 'p:hue-yellow'
time-foreground = 'p:hue-cyan'
separator-foreground = 'p:hue-white'

[secondary_prompt]
template = '<p:secondary-prompt-background,transparent></><,p:secondary-prompt-background> > </><p:secondary-prompt-background,transparent></> '
foreground = 'p:secondary-prompt-foreground'
background = 'transparent'

# ^C is hex red on purpose: Matrix Contrast has no red ANSI slot
[transient_prompt]
template = '<p:transient-prompt-background,transparent></><,p:transient-prompt-background> {{ if .Interrupted }}<#ff3b3b>^C</> {{ end }}{{ .Folder }} </><p:transient-prompt-background,transparent></> '
foreground = 'p:transient-prompt-foreground'
background = 'transparent'

[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = false

[[blocks.segments]]
leading_diamond = ''
trailing_diamond = ''
template = ' {{ if .SSHSession }} {{ end }}{{ .HostName }} '
foreground = 'p:session-foreground'
background = 'p:session-background'
type = 'session'
style = 'diamond'

[[blocks]]
type = 'prompt'
alignment = 'left'

# System info: load always; CPU, memory and GPU only at >= 80%.
[[blocks.segments]]
type = "sysinfo"
powerline_symbol = ''
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = " \uF0E4 {{ round .Load1 .Precision }} "
style = "powerline"

[blocks.segments.options]
precision = 1

[[blocks.segments]]
type = "text"
style = "powerline"
powerline_symbol = "\uE0B0"
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = "{{ if ge (atoi .Env.OMP_CPU) 80 }} \U000F061A {{ .Env.OMP_CPU }}% {{ end }}"

[[blocks.segments]]
type = "sysinfo"
powerline_symbol = ""
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = "{{ if ge .PhysicalPercentUsed 80.0 }} \U000F035B {{ round .PhysicalPercentUsed .Precision }}% {{ end }}"
style = "powerline"

[blocks.segments.options]
precision = 0

[[blocks.segments]]
type = "text"
style = "powerline"
powerline_symbol = "\uE0B0"
foreground = "p:sysinfo-foreground"
background = "p:sysinfo-background"
template = "{{ if ge (atoi .Env.OMP_GPU) 80 }} \U000F0379 {{ .Env.OMP_GPU }}% {{ end }}"

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
template = '  {{ path .Path .Location }} '
foreground = 'p:path-foreground'
powerline_symbol = ''
background = 'p:path-background'
type = 'path'
style = 'powerline'

[blocks.segments.options]
style = 'mixed'
mixed_threshold = 10

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
foreground = 'p:git-foreground'
powerline_symbol = ''
background = 'p:git-background'
type = 'git'
style = 'powerline'
background_templates = [
  '{{ if or (.Working.Changed) (.Staging.Changed) }}p:git-background-dirty{{ end }}',
  '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git-background-diverged{{ end }}',
  '{{ if gt .Ahead 0 }}p:git-background-ahead{{ end }}',
  '{{ if gt .Behind 0 }}p:git-background-behind{{ end }}',
]
foreground_templates = [
  '{{ if or (.Working.Changed) (.Staging.Changed) }}p:git-foreground{{ end }}',
  '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git-foreground-diverged{{ end }}',
  '{{ if gt .Ahead 0 }}p:git-foreground-diverged{{ end }}',
]

[blocks.segments.options]
branch_template = '{{ trunc 10 .Branch }}'

[[blocks.segments]]
type = "python"
style = "powerline"
powerline_symbol = ""
foreground = "p:python-foreground"
background = "p:python-background"
template = "  {{ .Venv }} "

[blocks.segments.options]
home_enabled = true
display_mode = "environment"

[[blocks.segments]]
template = '  '
foreground = 'p:root-foreground'
powerline_symbol = ''
background = 'p:root-background'
type = 'root'
style = 'powerline'

# Simple round end: matches the background of the nearest enabled
# segment in this block (falls back to git when python/root are
# hidden); parentBackground only resolves within one block, so
# this must share a block with git rather than get its own.
[[blocks.segments]]
type = 'text'
style = 'powerline'
foreground = 'parentBackground'
background = 'parentBackground'
template = "<background,transparent></>"

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:prompt-foreground'
foreground_templates = ['{{ if gt .Code 0 }}p:prompt-foreground-error{{ end }}']
template = "\n❯"

[[blocks]]
type = 'rprompt'

[[blocks.segments]]
type = "executiontime"
background = 'transparent'
foreground = 'p:duration-foreground'
template = "{{ .FormattedMs }}<p:separator-foreground> | </>"

[[blocks.segments]]
template = '<p:time-foreground><b>{{ .CurrentDate | date "15:04:05" }}</b></>'
foreground = 'p:separator-foreground'
background = 'transparent'
type = 'time'
style = 'plain'
