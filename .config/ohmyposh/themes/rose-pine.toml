[palettes.list.rose-pine]
# Rosé Pine main (https://rosepinetheme.com, @rose-pine/palette); pairs with herdr's rose-pine UI theme
hue-black = '#191724'   # base
hue-grey = '#6E6A86'    # muted
hue-blue = '#9CCFD8'    # foam
hue-green = '#31748F'   # pine
hue-orange = '#EBBCBA'  # rose
hue-red = '#EB6F92'     # love
hue-white = '#E0DEF4'   # text
hue-yellow = '#F6C177'  # gold
hue-accent = '#C4A7E7'  # iris

# Rosé Pine accents are light: dark text on them
secondary-prompt-foreground = 'p:hue-black'
secondary-prompt-background = 'p:hue-yellow'
transient-prompt-foreground = 'p:hue-white'
transient-prompt-background = 'p:hue-grey'

session-foreground = 'p:hue-black'
session-background = 'p:hue-yellow'

sysinfo-foreground = 'p:hue-black'
sysinfo-background = 'p:hue-accent'

path-foreground = 'p:hue-black'
path-background = 'p:hue-orange'

git-foreground = 'p:hue-black'
git-background = 'p:hue-blue'
git-foreground-diverged = 'p:hue-white'
git-background-dirty = 'p:hue-yellow'
git-background-diverged = 'p:hue-red'
git-background-ahead = 'p:hue-green'
git-background-behind = 'p:hue-accent'

root-foreground = 'p:hue-black'
root-background = 'p:hue-red'

python-foreground = '#ffd43b'
python-background = '#306998'

prompt-foreground = 'p:hue-accent'
prompt-foreground-error = 'p:hue-red'

duration-foreground = 'p:hue-yellow'
time-foreground = 'p:hue-blue'
separator-foreground = 'p:hue-grey'
