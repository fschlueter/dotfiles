# Matrix (matches the Ghostty "Matrix" theme): shades of green plus neon accents.
[palettes.list.matrix]
hue-black = '#0F191C'
hue-grey = '#7F9F76'
hue-forest = '#23755A'
hue-mint = '#2FC079'
hue-green = '#82D967'
hue-lime = '#C1FF8A'
hue-neon = '#11FF25'
hue-cyan = '#4FE8C8'
hue-yellow = '#FAFF00'
hue-red = '#FF3860'
hue-crimson = '#D8123F'
hue-white = '#D9FFD0'

secondary-prompt-foreground = 'p:hue-black'
secondary-prompt-background = 'p:hue-lime'
transient-prompt-foreground = 'p:hue-black'
transient-prompt-background = 'p:hue-grey'

session-foreground = 'p:hue-black'
session-background = 'p:hue-lime'

sysinfo-foreground = 'p:hue-black'
sysinfo-background = 'p:hue-mint'

path-foreground = 'p:hue-white'
path-background = 'p:hue-forest'

git-foreground = 'p:hue-black'
git-background = 'p:hue-green'
git-foreground-diverged = 'p:hue-white'
git-background-dirty = 'p:hue-yellow'
git-background-diverged = 'p:hue-crimson'
git-background-ahead = '#1B5E3F'
git-background-behind = '#0B6B6B'

root-foreground = 'p:hue-black'
root-background = 'p:hue-yellow'

python-foreground = 'p:hue-yellow'
python-background = '#0B6B6B'

prompt-foreground = 'p:hue-neon'
prompt-foreground-error = 'p:hue-red'

duration-foreground = 'p:hue-yellow'
time-foreground = 'p:hue-cyan'
separator-foreground = 'p:hue-white'
