[palettes.list.ansi]
# Terminal ANSI colors instead of hex, so the prompt follows the active Ghostty theme (Matrix Contrast outside
# herdr, `herdr-theme` inside). Layout of matrix.toml; each hue is the closest Matrix Contrast slot (comments:
# matrix.toml's hex), e.g. "red" holds yellow there. In standard palettes (Rose Pine) dirty git then shows red
# and errors gold. Shading (darken/lighten, gradients) does not work on ANSI names.
hue-black = 'black'       # #0F191C
hue-grey = 'darkGray'     # #7F9F76
hue-forest = 'blue'       # #23755A
hue-mint = 'lightGreen'   # #2FC079
hue-green = 'green'       # #82D967
hue-lime = 'white'        # #C1FF8A
hue-neon = 'green'        # #11FF25
hue-cyan = 'cyan'         # #4FE8C8
hue-yellow = 'red'        # #FAFF00
hue-red = 'lightYellow'   # #FF3860
hue-crimson = 'lightRed'  # #D8123F
hue-white = 'lightWhite'  # #D9FFD0

secondary-prompt-foreground = 'p:hue-black'
secondary-prompt-background = 'p:hue-lime'
transient-prompt-foreground = 'p:hue-black'
transient-prompt-background = 'p:hue-grey'

session-foreground = 'p:hue-black'
session-background = 'p:hue-lime'

sysinfo-foreground = 'p:hue-black'
sysinfo-background = 'p:hue-mint'

path-foreground = 'p:hue-black'    # dark text: 'blue' is brighter than forest
path-background = 'p:hue-forest'

git-foreground = 'p:hue-black'
git-background = 'p:hue-green'
git-foreground-diverged = 'p:hue-white'
git-background-dirty = 'p:hue-yellow'
git-background-diverged = 'p:hue-crimson'
git-background-ahead = 'blue'      # #1B5E3F
git-background-behind = 'darkGray' # #0B6B6B

root-foreground = 'p:hue-black'
root-background = 'p:hue-yellow'

python-foreground = 'p:hue-yellow'
python-background = 'black'        # #0B6B6B

prompt-foreground = 'p:hue-neon'
prompt-foreground-error = 'p:hue-red'

duration-foreground = 'p:hue-yellow'
time-foreground = 'p:hue-cyan'
separator-foreground = 'p:hue-white'
