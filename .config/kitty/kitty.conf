# Window size: c = character cells, or use plain numbers for pixels
remember_window_size  no
initial_window_width  160c
initial_window_height 60c
font_size 16.0

# No title bar or window decorations
hide_window_decorations yes
#hide_window_decorations titlebar-only

# Close without asking for confirmation
confirm_os_window_close 0
macos_quit_when_last_window_closed yes

# >>> herdr-radar font block
symbol_map U+E1A0-U+E1BA Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
# <<< herdr-radar font block
