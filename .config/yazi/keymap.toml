[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "<C-y>"
run = 'shell -- ~/.config/yazi/copy-file.sh %s'
desc = "Copy file(s) to system clipboard"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "plugin vcs-files"
desc = "Show Git file changes"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = "y"
run = [
  'shell -- if command -v pbcopy >/dev/null; then echo "$@" | pbcopy; elif command -v xclip >/dev/null; then echo "$@" | xclip -i -selection clipboard -t text/uri-list; fi',
  "yank",
]

[[mgr.prepend_keymap]]
on   = ["g", "m"]
run  = '''shell --block -- dest="$( { fd -t d -d 1 -a . ; fd -t d . ~ ; } | awk '!s[$0]++' | fzf --tiebreak=index --tmux 80%,60% --bind 'ctrl-d:reload(fd -t d -d 1 -a .),ctrl-h:reload(fd -t d . ~)' )" && mv -i -- %s "$dest"'''
desc = "Move selection to fzf-picked dir"

[[mgr.prepend_keymap]]
on   = ["g", "c"]
run  = '''shell --block -- dest="$( { fd -t d -d 1 -a . ; fd -t d . ~ ; } | awk '!s[$0]++' | fzf --tiebreak=index --tmux 80%,60% --bind 'ctrl-d:reload(fd -t d -d 1 -a .),ctrl-h:reload(fd -t d . ~)' )" && cp -Ri -- %s "$dest"'''
desc = "Copy selection to fzf-picked dir"

# keymap.toml
[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered file"
