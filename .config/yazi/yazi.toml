[mgr]
ratio = [1, 4, 3]

sort_by = "mtime"
sort_reverse = true
sort_dir_first = true

linemode = "size_and_mtime"

[preview]
wrap = "yes"
max_width = 10000
max_height = 10000
image_quality = 90

[plugin]
# Upscale small images to fill the preview pane (local plugin, see plugins/fit.yazi)
prepend_previewers = [
  { mime = "image/{png,jpeg,webp,bmp,gif}", run = "fit --timeout=1.5 --threshold=1.1 --keep=50" },
]
# Upscale the images on the current page in the background
prepend_preloaders = [
  { mime = "image/{png,jpeg,webp,bmp,gif}", run = "fit --timeout=1.5 --threshold=1.1 --keep=50" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
