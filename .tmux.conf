# Let image escape codes and the outer terminal's identity through, so yazi can preview images
# inside tmux (https://yazi-rs.github.io/docs/image-preview). Takes effect after `tmux kill-server`.
# -q: tmux < 3.3 lacks allow-passthrough; without it, the unknown option is an error shown on attach.
set -gq allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Ctrl+S as a second prefix (same as herdr's), Ctrl+B keeps working; Ctrl+S Ctrl+S sends a literal Ctrl+S
set -g prefix2 C-s
bind C-s send-prefix -2

# Plugins via TPM, in $DOTFILES_TMUX_PLUGINS (exported by a host profile, .env/hosts/) or ~/scratch/tmux/plugins.
# TPM is cloned and the plugins installed on the first start; later: prefix + I (install), prefix + U (update).
# The path is resolved in run-shell because tmux < 3.0 (one server has 2.7) does not expand $VARs in this file.
# The server takes the environment of the shell that starts it: after changing the variable, `tmux kill-server`.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'  # Ctrl+h/j/k/l moves between tmux panes and vim splits
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'colour6'  # ANSI slot 6 (cyan), follows the Ghostty palette

# keep at the bottom: TPM reads the @plugin lines above
run-shell 'd="${DOTFILES_TMUX_PLUGINS:-$HOME/scratch/tmux/plugins}"; tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$d/"; [ -d "$d/tpm" ] || { git clone -q https://github.com/tmux-plugins/tpm "$d/tpm" && "$d/tpm/bin/install_plugins" >/dev/null; }; "$d/tpm/tpm"'
